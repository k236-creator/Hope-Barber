<title>Hope Barber Shop Wrocław</title>

<style>
:root{--ink:#080808;--g1:#121212;--g2:#1b1b1b;--bone:#f1ede6;--mute:#9b968c;--amb:#ffb02e;--red:#e4332b;--line:#2a2a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ink);color:var(--bone);font:400 16px/1.6 Manrope,system-ui,sans-serif}
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;font-weight:500;line-height:1.1;margin:0}
a{color:inherit;text-decoration:none}
.w{max-width:1160px;margin:0 auto;padding:0 20px}
section{padding:92px 0}
h2{font-size:clamp(28px,5vw,48px);margin-bottom:12px;letter-spacing:-.01em}
.sub{color:var(--mute);max-width:560px;margin:0 0 40px}
nav{position:fixed;inset:0 0 auto;z-index:20;padding-top:env(safe-area-inset-top,0px);background:rgba(8,8,8,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.logo{font:700 20px Unbounded,sans-serif;letter-spacing:.04em}.logo small{display:block;font:400 10px Manrope;letter-spacing:.3em;color:var(--mute)}
.links{display:flex;gap:26px;font-size:14px;color:var(--mute)}.links a:hover{color:var(--bone)}
.lang{display:flex;gap:2px}.lang button{background:none;border:1px solid transparent;color:var(--mute);font:700 12px Manrope;padding:6px 8px;cursor:pointer;border-radius:6px}
.lang button.on{color:var(--ink);background:var(--bone)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 30px;border-radius:999px;font:700 15px Manrope;letter-spacing:.02em;border:0;cursor:pointer;position:relative;transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.hot{background:linear-gradient(135deg,#ffc24a,var(--amb) 50%,#ff8a1f);color:#1a0f00;box-shadow:0 0 0 0 rgba(255,176,46,.6),0 10px 40px rgba(255,150,30,.45);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,176,46,.65),0 10px 40px rgba(255,150,30,.45)}70%{box-shadow:0 0 0 18px rgba(255,176,46,0),0 10px 40px rgba(255,150,30,.45)}100%{box-shadow:0 0 0 0 rgba(255,176,46,0),0 10px 40px rgba(255,150,30,.45)}}
.ghost{border:1px solid var(--bone);color:var(--bone);background:rgba(8,8,8,.4)}.ghost:hover{background:var(--bone);color:var(--ink)}
.navbtn{padding:11px 20px;font-size:13px}
.hot{overflow:hidden;animation:pulse 1.6s infinite,beat 1.6s infinite;text-transform:none}
.hot::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 2.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes shine{0%,55%{left:-70%}100%{left:130%}}
.ghost{animation:ghostglow 2.4s ease-in-out infinite}
@keyframes ghostglow{0%,100%{box-shadow:0 0 0 rgba(255,176,46,0);border-color:var(--bone)}50%{box-shadow:0 0 22px rgba(255,176,46,.55);border-color:var(--amb)}}
.links a{padding:6px 2px;animation:blink 2.8s ease-in-out infinite}
.links a:nth-child(2){animation-delay:.4s}.links a:nth-child(3){animation-delay:.8s}.links a:nth-child(4){animation-delay:1.2s}.links a:nth-child(5){animation-delay:1.6s}
@keyframes blink{0%,100%{color:var(--mute);text-shadow:none}50%{color:var(--amb);text-shadow:0 0 14px rgba(255,176,46,.85)}}
.hh{position:relative;overflow:hidden;animation:ghostglow 2.2s ease-in-out infinite}
.hh::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,176,46,.35),transparent);transform:skewX(-20deg);animation:shine 2.8s infinite}
.av{animation:ghostglow 2.6s ease-in-out infinite}.m:nth-child(2) .av{animation-delay:.5s}.m:nth-child(3) .av{animation-delay:1s}.m:nth-child(4) .av{animation-delay:1.5s}.m:nth-child(5) .av{animation-delay:2s}
.perks li{position:relative;overflow:hidden}.perks li::after{content:"";position:absolute;inset:0 auto 0 -60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,176,46,.14),transparent);transform:skewX(-20deg);animation:shine 3.6s infinite}
.tabs button{animation:tabglow 3s ease-in-out infinite}

.hero h1{font-size:clamp(46px,11vw,132px);font-weight:300;letter-spacing:.02em;margin-bottom:6px;text-shadow:0 0 40px rgba(255,176,46,.35)}
.hero p.t{font:300 clamp(15px,2.4vw,22px) Unbounded;letter-spacing:.35em;color:var(--amb);margin:0 0 22px}
.hero p.d{max-width:520px;color:#d9d4ca;margin:0 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:28px;margin-top:44px;padding-top:24px;border-top:1px solid rgba(255,255,255,.18);font-size:14px;color:#cfcac0}.meta b{color:var(--bone);font-family:Unbounded;font-weight:500;font-size:22px;display:block}
.about{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gal img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block;filter:grayscale(.2) contrast(1.05)}
.gal .a{aspect-ratio:3/4}.gal .b{aspect-ratio:3/4;margin-top:36px}.gal .c{aspect-ratio:1}.gal .d{aspect-ratio:1;margin-top:-24px}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0 0;padding:0;list-style:none}.perks li{padding:14px 16px;border-left:2px solid var(--amb);background:var(--g1);font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:24px;padding-bottom:6px}
.tabs button{flex:none;background:var(--g1);border:1px solid var(--line);color:var(--mute);padding:11px 20px;border-radius:999px;font:700 13px Manrope;cursor:pointer}
.tabs button.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
.row h3{font:500 17px Manrope}.row small{color:var(--mute);display:block;font-size:13px}
.row .p{font:500 20px Unbounded;white-space:nowrap}.row .p em{font:400 12px Manrope;color:var(--mute);font-style:normal;margin-left:6px}
.row .btn{padding:10px 20px;font-size:13px}
.hh{margin-top:26px;padding:18px 22px;border:1px solid var(--amb);border-radius:6px;color:var(--amb);font-weight:700;box-shadow:inset 0 0 30px rgba(255,176,46,.08)}
.team{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.m{background:var(--g1);border:1px solid var(--line);padding:26px 16px;text-align:center;border-radius:6px;transition:border-color .2s}.m:hover{border-color:var(--amb)}
.av{width:92px;height:92px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;font:300 34px Unbounded;border:1px solid var(--amb);box-shadow:0 0 24px rgba(255,176,46,.25);background:radial-gradient(circle at 30% 25%,#2a2a2a,#0d0d0d)}
.m h3{font-size:16px;letter-spacing:.08em}.m p{margin:6px 0 0;color:var(--mute);font-size:13px}.m .x{color:var(--amb);font-size:12px;margin-top:10px}
.school{background:linear-gradient(120deg,var(--g1),#1d1308);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.school .w{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.school img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.rev{display:flex;gap:40px;align-items:center;flex-wrap:wrap}.rev .n{font:300 clamp(70px,12vw,130px) Unbounded;color:var(--amb);line-height:1;text-shadow:0 0 50px rgba(255,176,46,.4)}
.bars{flex:1;min-width:240px}.bars div{display:grid;grid-template-columns:20px 1fr 48px;gap:10px;align-items:center;font-size:13px;color:var(--mute);margin:6px 0}.bars i{height:6px;background:var(--g2);border-radius:3px;overflow:hidden}.bars i b{display:block;height:100%;background:var(--amb)}
.loc{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.map{min-height:340px;border-radius:6px;border:1px solid var(--line);background:radial-gradient(circle at 50% 50%,rgba(255,176,46,.18),transparent 45%),repeating-linear-gradient(0deg,#101010 0 38px,#161616 38px 40px),repeating-linear-gradient(90deg,transparent 0 58px,#161616 58px 60px);display:grid;place-items:center;text-align:center;padding:20px}
.map{position:relative;overflow:hidden}.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2;filter:invert(.9) hue-rotate(180deg) saturate(.7) brightness(.95) contrast(1.05)}.map .fb{position:relative;z-index:1}
.pin{width:18px;height:18px;border-radius:50%;background:var(--amb);margin:0 auto 14px;box-shadow:0 0 0 8px rgba(255,176,46,.2),0 0 40px var(--amb)}
.hrs{width:100%;border-collapse:collapse;margin:18px 0 26px}.hrs td{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}.hrs td:last-child{text-align:right;font-weight:700}

const D=[["Pn","10:00–20:00"],["Wt","10:00–20:00"],["Śr","10:00–20:00"],["Czw","10:00–20:00"],["Pt","10:00–20:00"],["Sob","10:00–18:30"],["Niedz","10:00–17:00"]];
const DN={pl:["Poniedziałek","Wtorek","Środa","Czwartek","Piątek","Sobota","Niedziela"],uk:["Понеділок","Вівторок","Середа","Четвер","П’ятниця","Субота","Неділя"],ru:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"],en:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]};
const yrs={pl:"lat",uk:"років",ru:"лет",en:"yrs"};
let cur=0,lang="pl";
try{lang=localStorage.getItem("hl")||"pl"}catch(e){}
if(!T[lang])lang="pl";
function render(){const t=T[lang];
document.documentElement.lang=lang;
document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
document.getElementById("tabs").innerHTML=t.cat.map((c,i)=>`<button class="${i===cur?"on":""}" data-i="${i}">${c}</button>`).join("");
document.getElementById("list").innerHTML=S[cur].map(s=>`<div class="row"><div><h3>${s[0]}</h3></div><div class="p">${s[1]}<em>${s[2]}</em></div><a class="btn hot" href="https://hopewroclaw.booksy.com/" target="_blank" rel="noopener">${t.bk}</a></div>`).join("");
document.getElementById("tm").innerHTML=M.map(m=>`<div class="m"><div class="av">${m[0][0]}</div><h3>${m[0]}</h3><p>${m[1]}</p><p class="x">${m[2]} ${yrs[lang]}</p><p>${m[3]}</p></div>`).join("");
document.getElementById("hrs").innerHTML=D.map((d,i)=>`<tr><td>${DN[lang][i]}</td><td>${d[1]}</td></tr>`).join("");}
document.addEventListener("click",e=>{const l=e.target.closest(".lang button");if(l){lang=l.dataset.l;try{localStorage.setItem("hl",lang)}catch(x){}render()}
const b=e.target.closest("#tabs button");if(b){cur=+b.dataset.i;render()}});
render();
document.addEventListener("securitypolicyviolation",e=>{const f=document.getElementById("gmap");if(f&&String(e.blockedURI).indexOf("google")>-1)f.remove()});
</script>
